# The npm packages as a consumer gets them (docs/RELEASING.md): build @inferal-oss/semblance and
# @inferal-oss/semblance-react, pack them, check what the tarballs carry, install them into an empty
# project and build and render examples/hello from them (the browser build, renderToString in
# Node, the CLI, the declarations). On every pull request and push to main that touches what ships.
name: Package

on:
  push:
    branches: [main]
    paths: ['src/**', 'bin/**', 'ontology/**', 'rdf-engine/**', 'layout-solver/**', 'packages/**', 'examples/hello/**', 'scripts/build-package.ts', 'scripts/pack-check.ts', 'scripts/package-exports.ts', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/package.yml']
  pull_request:
    paths: ['src/**', 'bin/**', 'ontology/**', 'rdf-engine/**', 'layout-solver/**', 'packages/**', 'examples/hello/**', 'scripts/build-package.ts', 'scripts/pack-check.ts', 'scripts/package-exports.ts', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/package.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Semblance's own engines and the layout solver's twins: the Rust builds need the wasm32 target.
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run engine:build
      - run: npm run layout:build
      - run: npm run pack:check
