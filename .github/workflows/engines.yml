# Semblance's own engines (rdf-engine/): the WAT and Rust builds match one to one, and WAT is at
# least as fast (#13). On every pull request and push to main that touches an engine: the parity
# tests, W3C conformance on both builds against the recorded results, their sizes, and the speed check.
name: Engines

on:
  push:
    branches: [main]
    paths: ['rdf-engine/**', 'test/rdf-engine*', 'test/harness.ts', 'src/**', 'ontology/**', 'demo/**', '.github/workflows/engines.yml']
  pull_request:
    paths: ['rdf-engine/**', 'test/rdf-engine*', 'test/harness.ts', 'src/**', 'ontology/**', 'demo/**', '.github/workflows/engines.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run engine:build
      - run: npm run engine:check
      # The same results on Semblance's queries, the same W3C failures, the same temporal values.
      - run: npx vitest run test/rdf-engine-parity.test.ts test/rdf-engine-temporal.test.ts test/rdf-engine.test.ts
      # W3C conformance on both builds: the results must be the ones recorded in the repository.
      - run: sh rdf-engine/conformance/fetch.sh
      - run: npm run conformance -- --target wat
      - run: npm run conformance -- --target rust
      - run: git diff --exit-code rdf-engine/conformance/results
      - run: npm run engine:sizes -- 0
      # Shared runners are noisier than a workstation: a wider margin than the default.
      - run: npm run engine:speed -- --rounds 3 --margin 0.25
