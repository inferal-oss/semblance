# The demo site on GitHub Pages: the multi-file Vite build (hashed, cacheable assets; the
# Oxigraph WASM and Semblance's engines as their own files, each fetched only for its store). The single-file build is kept as
# a downloadable artifact of each run. Tests run alongside and do not hold up the deploy.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Semblance's own engines (rdf-engine/): the Rust one needs the wasm32 target.
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run engine:build
      - run: npx tsc --noEmit
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: semblance-single-file
          path: dist-single/semblance.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run engine:build
      - run: npx vitest run
